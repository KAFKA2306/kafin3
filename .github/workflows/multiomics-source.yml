name: Multiomics source

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_clinical_trials.py
      - scripts/update_multiomics.py
      - scripts/build_multiomics_summary.py
      - .github/workflows/multiomics-source.yml

permissions:
  contents: write

concurrency:
  group: multiomics-source
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NHGRI workbook reader
        run: python -m pip install xlrd==2.0.2
      - name: Refresh primary evidence
        run: |
          python scripts/update_multiomics.py
          python scripts/build_multiomics_summary.py
      - name: Validate canonical API
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('api/v1/multiomics')
          trials = json.loads((root/'clinical-trials.json').read_text())
          costs = json.loads((root/'sequencing-costs.json').read_text())
          approvals = json.loads((root/'fda-approvals.json').read_text())
          summary = json.loads((root/'summary.json').read_text())
          assert trials['study_count'] > 0 and trials['api_version'].get('dataTimestamp')
          assert len(costs['observations']) >= 10
          assert approvals['approval_count'] > 0
          assert summary['clinical_trials']['study_count'] == trials['study_count']
          assert summary['sequencing_costs']['observation_count'] == len(costs['observations'])
          assert summary['fda_approvals']['approval_count'] == approvals['approval_count']
          assert 'studies' not in summary['clinical_trials']
          assert 'approvals' not in summary['fda_approvals']
          PY
      - name: Commit changed evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/v1/multiomics
          if git diff --cached --quiet; then
            echo 'No multiomics evidence change.'
            exit 0
          fi
          git commit -m 'data: update multiomics primary evidence'
          git push
