name: Multiomics source

on:
  schedule:
    - cron: '30 14 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/collect_clinical_trials.py
      - scripts/update_multiomics.py
      - scripts/build_multiomics_summary.py
      - scripts/verify_multiomics_artifacts.py
      - .github/workflows/multiomics-source.yml

permissions:
  contents: write

concurrency:
  group: multiomics-source
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NHGRI workbook reader
        run: python -m pip install xlrd==2.0.2
      - name: Refresh primary evidence
        run: |
          python scripts/update_multiomics.py
          python scripts/build_multiomics_summary.py
      - name: Canonical pre-push verification
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
          python scripts/verify_multiomics_artifacts.py api/v1/multiomics
      - name: Commit changed evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/v1/multiomics
          if git diff --cached --quiet; then
            echo 'No multiomics evidence change.'
            exit 0
          fi
          git commit -m 'data: update multiomics primary evidence'
          git push
