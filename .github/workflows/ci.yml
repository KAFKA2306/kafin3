name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Reject tracked OAuth credential files
        run: |
          if git ls-files | grep -Eq '(^|/)(token|credentials)\.json$'; then
            echo "Tracked OAuth credential file detected" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install NHGRI workbook reader
        run: python -m pip install xlrd==2.0.2
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: ClinicalTrials.gov smoke test
        run: |
          python scripts/collect_clinical_trials.py --pages 1 --page-size 5 --output /tmp/clinical-trials.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/clinical-trials.json').read_text())
          assert payload['studies']
          assert payload['version_source']['url'].endswith('/version')
          assert payload['api_version'].get('dataTimestamp')
          assert payload['source_pages']
          print(f"verified {len(payload['studies'])} studies; dataTimestamp={payload['api_version']['dataTimestamp']}")
          PY
      - name: Build live multiomics evidence
        run: |
          python scripts/update_multiomics.py --output /tmp/multiomics
          python scripts/build_multiomics_summary.py --root /tmp/multiomics
      - name: Audit live multiomics evidence
        run: python scripts/verify_multiomics.py /tmp/multiomics
      - name: Clean checkout
        run: test -z "$(git status --porcelain)"
